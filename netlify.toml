[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA yönlendirmesi: bilinmeyen tüm yollar index.html'e düşer
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Deploy preview'ları kapat: build kredisi tüketmesin (sadece main deploy eder)
[context.deploy-preview]
  command = "echo 'deploy preview devre dışı'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
